<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ARAQUM ID</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; text-align: center; }
        .btn-vk { background: #0077ff; color: white; padding: 12px 24px; border: none; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }
    </style>
	<script nonce="csp_nonce" src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
</head>
<body>
    <div class="card">
        <h1>ARAQUM ID</h1>
        <p>Выберите способ входа:</p>
		<div>
  
  <script nonce="csp_nonce" type="text/javascript">
    if ('VKIDSDK' in window) {
      const VKID = window.VKIDSDK;

      VKID.Config.init({
        app: 54769644,
        redirectUrl: 'https://id.araqum.ru/api/v1/auth/oauth/vk/callback',
        responseMode: VKID.ConfigResponseMode.Callback,
        source: VKID.ConfigSource.LOWCODE,
        scope: '', // Заполните нужными доступами по необходимости
      });

      const oneTap = new VKID.OneTap();

      oneTap.render({
        container: document.currentScript.parentElement,
        showAlternativeLogin: true,
        oauthList: [
          'mail_ru',
          'ok_ru'
        ]
      })
      .on(VKID.WidgetEvents.ERROR, vkidOnError)
      .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
        const code = payload.code;
        const deviceId = payload.device_id;

        VKID.Auth.exchangeCode(code, deviceId)
          .then(vkidOnSuccess)
          .catch(vkidOnError);
      });
    
      function vkidOnSuccess(data) {
        // Обработка полученного результата
      }
    
      function vkidOnError(error) {
        // Обработка ошибки
      }
    }
  </script>
</div>
        <!--a href="https://id.araqum.ru/api/v1/auth/oauth/vk/login" class="btn-vk">Войти через VK ID</a//-->
    </div>
</body>
</html>
